# Donating (2026-10-20, prison round 3): the Taped Club, a makeshift weapon Sparks makes in the prison's workshop from
# the Mop Handle and the Duct Tape (jailjobs.sk). Never sold or unlocked (core.sk wpn::Taped_Club::makeshift): the one
# copy is kept until a death. The rule for every melee: Base_Damage + any bonus <= 5.0; the makeshift ones stay weaker
# than the Combat Knife (5.0 a second). PROPOSAL numbers.
Taped_Club:
  Info:
    Cancel:
      Drop_Item: true
      Swap_Hands: true
    Weapon_Item:
      # Donating: an amethyst shard drawn by the pack by its custom model data (tools\make-item-art.js, taped_club).
      Type: "AMETHYST_SHARD"
      Name: "<gold>Taped Club"
      Lore:
        - "<gray>Half a mop handle, wrapped thick."
        - "<gray>Heavy hits, slow swings."
        - ""
        - "<gray>Weapon Statistics"
        - "<gold>➣<gray> 4 <gold>⟸ <gray>Damage"
        - "<gold>➣<gray> 0.8 <gold>⟸ <gray>Hits per second"
        - "<gold>➣<gray> 3.5 <gold>⟸ <gray>Range in blocks"
      Unbreakable: true
      Hide_Flags: true
      Attributes:
        - "movement_speed -0.004"
        - "attack_speed -3.23"
      Deny_Use_In_Crafting: true
    Weapon_Get_Mechanics:
      - "Sound{sound=item.armor.equip_leather, pitch=0.6, listeners=Source{}}"
    Weapon_Equip_Mechanics:
      - "Sound{sound=item.armor.equip_leather, volume=0.6, pitch=0.6, listeners=Source{}}"
  Skin:
    Default:
      Custom_Model_Data: 10
  Damage:
    # Donating: 4 a hit every 26 ticks (3.1 a second; 5 hits unarmored, a prison guard's 10 HP in 3). MeleeFx: the
    # client's whack, 16 ticks (a plain box model with no glove).
    Base_Damage: 4
    Armor_Damage: 2
    Mechanics:
      - "Sound{sound=entity.player.attack.knockback, pitch=0.6, volume=0.7} @Target{}"
    Head:
      Bonus_Damage: 0
    Backstab:
      Bonus_Damage: 0
  Melee:
    Enable_Melee: true
    Melee_Range: 3.5
    Melee_Hit_Delay: 26
    Melee_Miss:
      Mechanics:
        - "Sound{sound=entity.player.attack.nodamage, pitch=0.7, noise=0.1}"
      Melee_Miss_Delay: 26
