# Donating (2026-10-13): this title draws the Katana (from PG3D's Katana, in the older straighter Last Samurai shape,
# hand-made); it was the Karambit, and the Dagger before that. The title is kept, like the guns' (50_GS = the Classic
# Pistol). The rule for every melee: Base_Damage + any bonus <= 5.0 (4 hits unarmored even at x1.30), always under the
# AK-48's 5.5.
Dagger:
  Info:
    Cancel:
      Drop_Item: true
      Swap_Hands: true
    Weapon_Item:
      # Donating: not a feather (WeaponMechanics' pack owns feather.json); the pack's amethyst_shard.json
      # draws it by its custom model data (tools\guns\katana.js).
      Type: "AMETHYST_SHARD"
      Name: "<gold>Katana"
      Lore:
        - "<gray>A long blade with a red-wrapped hilt."
        - "<gray>The longest reach of any melee."
        - ""
        - "<gray>Weapon Statistics"
        - "<gold>➣<gray> 5 <gold>⟸ <gray>Damage"
        - "<gold>➣<gray> 1.25 <gold>⟸ <gray>Hits per second"
        - "<gold>➣<gray> 4.5 <gold>⟸ <gray>Range in blocks"
      Unbreakable: true
      Hide_Flags: true
      Attributes:
        - "attack_speed -2.75"
      Deny_Use_In_Crafting: true
    Weapon_Get_Mechanics:
      - "Sound{sound=item.armor.equip_iron, pitch=1.5, listeners=Source{}}"
    Weapon_Equip_Mechanics:
      - "Sound{sound=item.armor.equip_iron, volume=0.6, pitch=1.5, listeners=Source{}}"
  Skin:
    Default:
      Custom_Model_Data: 1
  Damage:
    # Donating: the knife's 5 a hit (4 hits unarmored, 12 in the best gear; a head hit 5.75, still 4), a hit every
    # 16 ticks and a 4.5-block reach (vanilla's spear). No head or backstab bonus (the global Head +15% and Back +5%
    # already count). DonatingPhone's MeleeFx gives it a 10-tick whack.
    Base_Damage: 5
    Armor_Damage: 4
    Mechanics:
      - "Sound{sound=entity.player.attack.sweep, pitch=0.95, volume=0.7} @Target{}"
    Head:
      Bonus_Damage: 0
    Backstab:
      Bonus_Damage: 0
  Melee:
    Enable_Melee: true
    Melee_Range: 4.5
    Melee_Hit_Delay: 16
    Melee_Miss:
      Mechanics:
        - "Sound{sound=entity.player.attack.sweep, pitch=0.8, volume=0.5, noise=0.1}"
      Melee_Miss_Delay: 16
