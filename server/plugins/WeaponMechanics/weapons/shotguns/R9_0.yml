R9_0:
  Info:
    Weapon_Item:
      Type: "FEATHER"
      Name: "<gold>Shotgun"
      Lore:
        - "<gray>A short pump shotgun with a pistol grip."
        - "<gray>Loads one shell at a time; deadly up close."
        - ""
        - "<gray>Weapon Statistics <gold>-<gray> 62.2"
        - "<gold>➣<gray> 55 <gold>⟸ <gray>Accuracy"
        - "<gold>➣<gray> 79 <gold>⟸ <gray>Damage"
        - "<gold>➣<gray> 42 <gold>⟸ <gray>Range"
        - "<gold>➣<gray> 51 <gold>⟸ <gray>Fire Rate"
        - "<gold>➣<gray> 71 <gold>⟸ <gray>Mobility"
        - "<gold>➣<gray> 74 <gold>⟸ <gray>Control"
      Unbreakable: true
      Hide_Flags: true
      Attributes:
        - "movement_speed -0.0005"
      Deny_Use_In_Crafting: true
    Weapon_Info_Display:
      Action_Bar:
        Message: "<gold>Shotgun <gray>«<gold><ammo_left><gray>»<gold><reload>"
    # Donating (owner, 2026-09-29): gun noises 35% quieter. The vanilla sounds in this file play at 65% of before (volume 1 -> 0.65,
    # 0.5 -> 0.325); WeaponMechanics' own (shots, reloads, scope, whiz) are lowered in the pack (tools\build-pack.js GUN_SOUND_VOLUME).
    Weapon_Get_Mechanics:
      - "Sound{sound=item.armor.equip_chain, volume=0.65, pitch=0.75}"
    # Donating (2026-10-05): the draw's sound (Weapon_Get_Mechanics only plays when the gun is given).
    Weapon_Equip_Mechanics:
      - "CustomSound{sound=donating.gun.shotgun.draw, volume=0.5, noise=0.05, listeners=Source{}}"
    Weapon_Equip_Delay: 20
    Cancel:
      Drop_Item: true
      Swap_Hands: true
      Arm_Swing_Animation: true
      Break_Blocks: true
  # Donating (2026-10-05, the PG3D remake): the pack also draws Reload (+3000) and No_Ammo (+4000), and animates each shot
  # (the kick and the pump) and each shell going in from the cooldown DonatingPhone's GunFx starts (tools\guns\r90.js).
  Skin:
    Default: 14
    Scope: ADD 1000
    Sprint: ADD 2000
    Reload: ADD 3000
    No_Ammo: ADD 4000
  Projectile: "donating_pellet"
  Shoot:
    Trigger:
      Main_Hand: "RIGHT_CLICK"
      Off_Hand: "RIGHT_CLICK"
      Circumstance:
        Swimming: "DENY"
        Sprinting: "DENY"
    Projectile_Speed: 60
    Projectiles_Per_Shot: 10
    Delay_Between_Shots: 7
    Spread:
      Spread_Image:
        Name: "cross"
        Field_Of_View_Width: 16
        Field_Of_View_Height: 16
    Recoil:
      Mean_X: 0.0
      Mean_Y: 3.2
      Variance_X: 0.1
      Variance_Y: 0.4
      Speed: 4.2
      Damping: 0.2
      Damping_Recovery: 0.25
      Smoothing: 0.2
      Max_Accumulation: 10.0
    Mechanics:
      - "CustomSound{sound=donating.gun.shotgun.shoot, volume=6, noise=0.05}"
  Reload:
    Trigger:
      Main_Hand: "DROP_ITEM"
      Off_Hand: "DROP_ITEM"
    Magazine_Size: 14
    # Donating: item ammo bought at gun shops (shop.sk); without this the gun reloads for free.
    Ammo:
      Ammos:
        - "Donating_Shells"
    Ammo_Per_Reload: 1
    Reload_Duration: 4
    Finish_Mechanics:
      - "CustomSound{sound=donating.gun.shotgun.shell, volume=0.5, noise=0.05}"
  Damage:
    # Donating (owner, 2026-09-26): nerfed so the strongest gun kills an unarmored player in 4 body
    # shots and one in the best gear (11 armor points, Per_Armor_Point -6% in config.yml) in 10-12.
    # Per pellet: all 10 pellets at point blank = 6 damage, 4 blasts.
    Base_Damage: 0.6
    Armor_Damage: 4
    Dropoff:
      - "5 -0.12"
      - "10 -0.3"
      - "20 -0.48"
  Scope:
    Trigger:
      Main_Hand: "LEFT_CLICK"
      Off_Hand: "LEFT_CLICK"
    Zoom_Amount: 1.2
    Shoot_Delay_After_Scope: 12
    Mechanics:
      - "CustomSound{sound=scope.in, volume=0.5, noise=0.1, listeners=Source{}}"
    Zoom_Off:
      Mechanics:
        - "CustomSound{sound=scope.out, volume=0.5, noise=0.1, listeners=Source{}}"
  # Donating (2026-10-05, the PG3D remake): still two shots per pump (the gun's pace is unchanged). The pack draws the
  # pump in the 15-tick shot animation (tools\guns\r90.js); DonatingPhone's GunFx ends a shot that works no pump after
  # its kick (gunfx R9_0 alone: 5). The sounds are delayed to the drawn pump: back at tick 5, forward at tick 7 + 2 = 9.
  Firearm_Action:
    Type: "PUMP"
    Firearm_Action_Frequency: 2
    Open:
      Time: 7
      Mechanics:
        - "CustomSound{sound=donating.gun.shotgun.pump_back, volume=0.5, noise=0.05, listeners=Source{}, delayBeforePlay=5}"
    Close:
      Time: 7
      Mechanics:
        - "CustomSound{sound=donating.gun.shotgun.pump_fwd, volume=0.5, noise=0.05, listeners=Source{}, delayBeforePlay=2}"

  # The following options are added by WeaponMechanicsCosmetics, and you will
  # not see the changes take effect until you purchase it.

  Cosmetics:
    Muzzle_Flash: true
    Splash_Mechanics:
      - "Sound{sound=entity.generic.splash, volume=0.65, pitch=1.85, noise=0.15} @Target{}"
      - "Particle{particle=WATER_SPLASH, count=20, noise=0.2 0.2 0.2} @Target{}"
    Bullet_Zip:
      Maximum_Distance: 4.0
      Sounds:
        - "CustomSound{sound=fx.whiz, noise=0.02} @Target{}"
    Third_Person_Pose:
      Default: NONE
      Scope: BOW
      Reload: BLOCK
      Firearm_Action: CROSSBOW

  Trail:
    Distance_Between_Particles: 0.3
    Particle_Chooser: LOOP
    Particles:
      - "Particle{particle=DUST_COLOR_TRANSITION, color=RED, fadeColor=YELLOW, size=0.4}"
    Shape: SPIRAL
    Shape_Data:
      Radius: 0.3
      Points: 128
      Loops: 2

  Show_Time:
    Reload:
      Item_Cooldown: true
      Exp: true
      Action_Bar: "<gray>Reloading <bar> <gray><time>s"
      Action_Bar_Cancelled: "<red>Reload Cancelled"
      Bar:
        Left_Color: "<gray>"
        Right_Color: "<red>"
        Left_Symbol: "|"
        Right_Symbol: "|"
        Symbol_Amount: 8
    Weapon_Equip_Delay:
      Item_Cooldown: true
    Shoot_Delay_After_Scope:
      Item_Cooldown: true