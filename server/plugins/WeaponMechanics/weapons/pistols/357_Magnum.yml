357_Magnum:
  Info:
    Weapon_Item:
      Type: "FEATHER"
      Name: "<gold>Old Revolver"
      Lore:
        - "<gray>A western six-shooter with a long barrel."
        - "<gray>Hits hard; all six reload at once."
        - ""
        - "<gray>Weapon Statistics <gold>-<gray> 62.5"
        - "<gold>➣<gray> 60 <gold>⟸ <gray>Accuracy"
        - "<gold>➣<gray> 74 <gold>⟸ <gray>Damage"
        - "<gold>➣<gray> 56 <gold>⟸ <gray>Range"
        - "<gold>➣<gray> 44 <gold>⟸ <gray>Fire Rate"
        - "<gold>➣<gray> 76 <gold>⟸ <gray>Mobility"
        - "<gold>➣<gray> 65 <gold>⟸ <gray>Control"
      Unbreakable: true
      Hide_Flags: true
      Attributes:
        - "movement_speed -0.0005"
      Deny_Use_In_Crafting: true
    Weapon_Info_Display:
      Action_Bar:
        Message: "<gold>Old Revolver<firearm_state> <gray>«<gold><ammo_left><gray>»<gold><reload>"
    # Donating (owner, 2026-09-29): gun noises 35% quieter. The vanilla sounds in this file play at 65% of before (volume 1 -> 0.65,
    # 0.5 -> 0.325); WeaponMechanics' own and ours (shots, reloads, scope, whiz) are lowered in the pack (tools\build-pack.js GUN_SOUND_VOLUME).
    Weapon_Get_Mechanics:
      - "Sound{sound=item.armor.equip_chain, volume=0.65, pitch=0.75, listeners=Source{}}"
    # Donating (2026-10-06): the draw's sound, the twirl's whoosh and its catch (the pack animates the 12-tick draw;
    # Weapon_Get_Mechanics only plays when the gun is given).
    Weapon_Equip_Mechanics:
      - "CustomSound{sound=donating.gun.rev.spin, volume=0.5, noise=0.05, listeners=Source{}}"
    Weapon_Equip_Delay: 12
    Cancel:
      Drop_Item: true
      Swap_Hands: true
      Arm_Swing_Animation: true
      Break_Blocks: true
  # Donating (2026-10-06, a recreation of Pixel Gun 3D's Old Revolver): the pack draws Default 8, Scope +1000, Sprint
  # +2000 and Reload +3000 (no No_Ammo: WeaponMechanics puts it over Scope and Sprint, so an empty gun would drop out of
  # the sights), and animates the draw, each shot and the reload from the cooldown DonatingPhone's GunFx starts
  # (gunfx 357_Magnum: shot 8, draw 12; tools\guns\rev.js).
  Skin:
    Default: 8
    Scope: ADD 1000
    Sprint: ADD 2000
    Reload: ADD 3000
  Projectile: "donating_pistol_bullet"
  Shoot:
    Trigger:
      Main_Hand: "RIGHT_CLICK"
      Off_Hand: "RIGHT_CLICK"
      Circumstance:
        Swimming: "DENY"
        Sprinting: "DENY"
    Projectile_Speed: 85
    Delay_Between_Shots: 10
    Spread:
      Base_Spread: 3.6
      Modify_Spread_When:
        Zooming: 50%
        Sneaking: 50%
        In_Midair: 150%
    Recoil:
      Mean_X: 0.2
      Mean_Y: 3.0
      Variance_X: 0.1
      Variance_Y: 0.3
      Speed: 3.8
      Damping: 0.1
      Damping_Recovery: 0.2
      Smoothing: 0.3
      Max_Accumulation: 12.0
    # The bang, and the hammer cocked again 4 ticks later, where the pack draws it (the shot's frames: the hammer
    # comes back from tick 3.6 to 6.4 as the cylinder turns; the sound's clack is at its end).
    Mechanics:
      - "CustomSound{sound=donating.gun.rev.shoot, volume=6, noise=0.05}"
      - "CustomSound{sound=donating.gun.rev.cock, volume=0.5, noise=0.05, listeners=Source{}, delayBeforePlay=4}"
  Reload:
    Trigger:
      Main_Hand: "DROP_ITEM"
      Off_Hand: "DROP_ITEM"
    Magazine_Size: 6
    # Donating: item ammo bought at gun shops (shop.sk); without this the gun reloads for free.
    Ammo:
      Ammos:
        - "Donating_Light"
    # Donating (2026-10-06): one speedloader for all six (WeaponMechanics' default loaded one round at a time with a
    # REVOLVER firearm action; both are gone), so a reload is 40 ticks whether the gun is empty or not, and the sounds
    # are timed to the pack's frames (tools\guns\rev.js): the crane unlatched at tick 4 (as the cylinder starts to swing
    # out; its stop knock lands as it's fully out), the cases ejected at 11, the rounds pushed in at 22, the cylinder
    # snapped shut at 30. Not in Finish_Mechanics (it plays at the very end).
    Reload_Duration: 40
    Start_Mechanics:
      - "CustomSound{sound=donating.gun.rev.open, volume=0.5, noise=0.05, delayBeforePlay=4}"
      - "CustomSound{sound=donating.gun.rev.eject, volume=0.5, noise=0.05, delayBeforePlay=11}"
      - "CustomSound{sound=donating.gun.rev.load, volume=0.5, noise=0.05, delayBeforePlay=22}"
      - "CustomSound{sound=donating.gun.rev.close, volume=0.5, noise=0.05, delayBeforePlay=30}"
  Damage:
    # Donating (2026-10-06): the strongest gun (the AK-48) kills an unarmored player in 4 body shots and one in the
    # best gear (11 armor points, Per_Armor_Point -6% in config.yml) in 10-12; this one takes 4 and 12 up close, but
    # loses less at range (5.30 / 4.55 / 3.65 / 2.75 from 0 / 10 / 25 / 50 blocks).
    Base_Damage: 5.3
    Armor_Damage: 3
    Dropoff:
      - "10 -0.75"
      - "25 -1.65"
      - "50 -2.55"
  Scope:
    Trigger:
      Main_Hand: "LEFT_CLICK"
      Off_Hand: "LEFT_CLICK"
    Zoom_Amount: 1.35
    Shoot_Delay_After_Scope: 8
    Mechanics:
      - "CustomSound{sound=scope.in, volume=0.5, noise=0.1, listeners=Source{}}"
    Zoom_Off:
      Mechanics:
        - "CustomSound{sound=scope.out, volume=0.5, noise=0.1, listeners=Source{}}"

  Show_Time:
    Reload:
      Item_Cooldown: true
      Exp: true
      Action_Bar: "<gray>Reloading <bar> <gray><time>s"
      Action_Bar_Cancelled: "<red>Reload Cancelled"
      Bar:
        Left_Color: "<gray>"
        Right_Color: "<red>"
        Left_Symbol: "|"
        Right_Symbol: "|"
        Symbol_Amount: 6
    Weapon_Equip_Delay:
      Item_Cooldown: true
    Shoot_Delay_After_Scope:
      Item_Cooldown: true
