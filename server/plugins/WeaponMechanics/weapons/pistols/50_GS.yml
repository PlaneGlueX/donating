50_GS:
  Info:
    Weapon_Item:
      Type: "FEATHER"
      Name: "<gold>Classic Pistol"
      Lore:
        - "<gray>A chunky chrome pistol with a leather grip."
        - "<gray>Semi-automatic; quick to reload."
        - ""
        - "<gray>Weapon Statistics <gold>-<gray> 60.2"
        - "<gold>➣<gray> 54 <gold>⟸ <gray>Accuracy"
        - "<gold>➣<gray> 65 <gold>⟸ <gray>Damage"
        - "<gold>➣<gray> 52 <gold>⟸ <gray>Range"
        - "<gold>➣<gray> 53 <gold>⟸ <gray>Fire Rate"
        - "<gold>➣<gray> 77 <gold>⟸ <gray>Mobility"
        - "<gold>➣<gray> 60 <gold>⟸ <gray>Control"
      Unbreakable: true
      Hide_Flags: true
      Attributes:
        - "movement_speed -0.0009"
      Deny_Use_In_Crafting: true
    Weapon_Info_Display:
      Action_Bar:
        Message: "<gold>Classic Pistol<firearm_state> <gray>«<gold><ammo_left><gray>»<reload>"
        Dual_Wield:
          Main_Hand: "<gold><ammo_left><gray>»<reload> <gold><firearm_state>Classic Pistol"
          Off_Hand: "<gold>Classic Pistol<firearm_state> <reload><gray>«<gold><ammo_left>"
    Dual_Wield:
      Whitelist: true
      Weapons:
        - "50_GS"
    # Donating (owner, 2026-09-29): gun noises 35% quieter. The vanilla sounds in this file play at 65% of before (volume 1 -> 0.65,
    # 0.5 -> 0.325); WeaponMechanics' own (shots, reloads, scope, whiz) are lowered in the pack (tools\build-pack.js GUN_SOUND_VOLUME).
    Weapon_Get_Mechanics:
      - "Sound{sound=item.armor.equip_chain, volume=0.65, pitch=0.75, listeners=Source{}}"
    Weapon_Equip_Delay: 10
    Cancel:
      Drop_Item: true
      Swap_Hands: true
      Arm_Swing_Animation: true
      Break_Blocks: true
  # Donating (2026-10-05, the PG3D remake): the pack also draws Reload (+3000) (no No_Ammo: WeaponMechanics puts it over Scope and Sprint, so an empty gun would drop out of the sights), and animates the
  # reload and each shot from the cooldown DonatingPhone's GunFx starts (tools\guns\gs50.js).
  Skin:
    Default: 9
    Scope: ADD 1000
    Sprint: ADD 2000
    Reload: ADD 3000
  Projectile: "donating_pistol_bullet"
  Shoot:
    Trigger:
      Main_Hand: "RIGHT_CLICK"
      Off_Hand: "RIGHT_CLICK"
      Dual_Wield:
        Main_Hand: "RIGHT_CLICK"
        Off_Hand: "LEFT_CLICK"
      Circumstance:
        Sprinting: "DENY"
        Swimming: "DENY"
    Projectile_Speed: 80
    Delay_Between_Shots: 7
    Spread:
      Base_Spread: 5.75
      Modify_Spread_When:
        Zooming: 50%
        Sneaking: 50%
        In_Midair: 150%
    Recoil:
      Mean_X: 0.2
      Mean_Y: 2.2
      Variance_X: 0.1
      Variance_Y: 0.3
      Speed: 3.5
      Damping: 0.1
      Damping_Recovery: 0.2
      Smoothing: 0.3
      Max_Accumulation: 12.0
    Mechanics:
      - "CustomSound{sound=donating.gun.pistol.shoot, volume=6, noise=0.05}"
  Reload:
    Trigger:
      Main_Hand: "DROP_ITEM"
      Off_Hand: "DROP_ITEM"
    Magazine_Size: 7
    # Donating: item ammo bought at gun shops (shop.sk); without this the gun reloads for free.
    Ammo:
      Ammos:
        - "Donating_Light"
    Reload_Duration: 32
    # Donating (2026-10-05): both sounds timed to the reload's frames (tools\guns\gs50.js: the magazine drops from p 0.12,
    # the new one is slapped home at p 0.73); not in Finish_Mechanics, which plays at the very end (after the slide's
    # Close on an empty reload). With rounds left the frames run over 32 ticks; from empty the slide's open (3 ticks)
    # comes first, they stretch to 38 and these sounds start 3 ticks later: the delays split the difference
    # (35p - 1.5), within about 2 ticks either way.
    Start_Mechanics:
      - "CustomSound{sound=donating.gun.pistol.mag_out, volume=0.5, noise=0.05, delayBeforePlay=3}"
      - "CustomSound{sound=donating.gun.pistol.mag_in, volume=0.5, noise=0.05, delayBeforePlay=24}"
  Damage:
    # Donating (owner, 2026-09-26): nerfed so the strongest gun kills an unarmored player in 4 body
    # shots and one in the best gear (11 armor points, Per_Armor_Point -6% in config.yml) in 10-12.
    Base_Damage: 4.3
    Armor_Damage: 3
    Dropoff:
      - "10 -1.05"
      - "25 -2.11"
      - "50 -3.16"
  Scope:
    Trigger:
      Main_Hand: "LEFT_CLICK"
      Off_Hand: "LEFT_CLICK"
    Zoom_Amount: 1.3
    Shoot_Delay_After_Scope: 8
    Mechanics:
      - "CustomSound{sound=scope.in, volume=0.5, noise=0.1, listeners=Source{}}"
    Zoom_Off:
      Mechanics:
        - "CustomSound{sound=scope.out, volume=0.5, noise=0.1, listeners=Source{}}"
  # Donating (2026-10-05): silent; the reload's frames are a magazine swap with no slide pull (PG3D's), and this only
  # runs on an empty reload, where the slide sounds played with nothing on screen.
  Firearm_Action:
    Type: "SLIDE"
    Open:
      Time: 3
    Close:
      Time: 3


  # The following options are added by WeaponMechanicsCosmetics, and you will
  # not see the changes take effect until you purchase it.

  Cosmetics:
    Muzzle_Flash: true
    Splash_Mechanics:
      - "Sound{sound=entity.generic.splash, volume=0.65, pitch=1.85, noise=0.15} @Target{}"
      - "Particle{particle=WATER_SPLASH, count=20, noise=0.2 0.2 0.2} @Target{}"
    Bullet_Zip:
      Maximum_Distance: 4.0
      Sounds:
        - "CustomSound{sound=fx.whiz, noise=0.02, listeners=Target{}} @Target{}"
    Third_Person_Pose:
      Default: NONE
      Scope: BOW
      Reload: BLOCK
      Firearm_Action: CROSSBOW

  Trail:
    Distance_Between_Particles: 0.3
    Particle_Chooser: LOOP
    Particles:
      - "Particle{particle=DUST_COLOR_TRANSITION, color=RED, fadeColor=YELLOW, size=0.4}"

  Show_Time:
    Reload:
      Item_Cooldown: true
      Exp: true
      Action_Bar: "<gray>Reloading <bar> <gray><time>s"
      Action_Bar_Cancelled: "<red>Reload Cancelled"
      Bar:
        Left_Color: "<gray>"
        Right_Color: "<red>"
        Left_Symbol: "|"
        Right_Symbol: "|"
        Symbol_Amount: 7
    Weapon_Equip_Delay:
      Item_Cooldown: true
    Shoot_Delay_After_Scope:
      Item_Cooldown: true