Uzi:
  Info:
    Weapon_Item:
      Type: "FEATHER"
      Name: "<gold>Machine Gun"
      Lore:
        - "<gray>A full-auto SMG with a curved magazine."
        - "<gray>Fast, steady and easy to control."
        - ""
        - "<gray>Weapon Statistics <gold>-<gray> 64.5"
        - "<gold>➣<gray> 61 <gold>⟸ <gray>Accuracy"
        - "<gold>➣<gray> 67 <gold>⟸ <gray>Damage"
        - "<gold>➣<gray> 49 <gold>⟸ <gray>Range"
        - "<gold>➣<gray> 64 <gold>⟸ <gray>Fire Rate"
        - "<gold>➣<gray> 74 <gold>⟸ <gray>Mobility"
        - "<gold>➣<gray> 72 <gold>⟸ <gray>Control"
      Unbreakable: true
      Hide_Flags: true
      Attributes:
        - "movement_speed -0.0019"
      Deny_Use_In_Crafting: true
    Weapon_Info_Display:
      Action_Bar:
        Message: "<gold>Machine Gun<firearm_state> <gray>«<gold><ammo_left><gray>»<gold><reload>"
    # Donating (owner, 2026-09-29): gun noises 35% quieter. The vanilla sounds in this file play at 65% of before (volume 1 -> 0.65,
    # 0.5 -> 0.325); WeaponMechanics' own (shots, reloads, scope, whiz) are lowered in the pack (tools\build-pack.js GUN_SOUND_VOLUME).
    Weapon_Get_Mechanics:
      - "Sound{sound=item.armor.equip_chain, volume=0.65, pitch=0.75, listeners=Source{}}"
    # Donating (2026-10-05): the draw's sound (the pack animates the 20-tick draw; Weapon_Get_Mechanics only plays
    # when the gun is given).
    Weapon_Equip_Mechanics:
      - "CustomSound{sound=donating.gun.smg.draw, volume=0.5, noise=0.05, listeners=Source{}}"
    Weapon_Equip_Delay: 20
    Cancel:
      Drop_Item: true
      Swap_Hands: true
      Arm_Swing_Animation: true
  # Donating (2026-10-05, the PG3D remake): the pack also draws Reload (+3000) (no No_Ammo: WeaponMechanics puts it over Scope and Sprint, so an empty gun would drop out of the sights), and animates the
  # draw, the fire (while it really fires: GunFx's firing flag) and the reload from the cooldown DonatingPhone's GunFx starts (tools\guns\uzi.js).
  Skin:
    Default: 1
    Scope: ADD 1000
    Sprint: ADD 2000
    Reload: ADD 3000
  Projectile: "donating_smg_bullet"
  Shoot:
    Trigger:
      Main_Hand: "RIGHT_CLICK"
      Off_Hand: "RIGHT_CLICK"
      Circumstance:
        Swimming: "DENY"
        Sprinting: "DENY"
    Projectile_Speed: 80
    Fully_Automatic_Shots_Per_Second: 11
    Spread:
      Base_Spread: 4.9
      Modify_Spread_When:
        Zooming: 50%
        Sneaking: 50%
        In_Midair: 150%
    Recoil:
      Mean_X: 0.0
      Mean_Y: 0.6
      Variance_X: 0.4
      Variance_Y: 0.2
      Speed: 1.8
      Damping: 0.05
      Damping_Recovery: 0.1
      Smoothing: 0.25
      Max_Accumulation: 6.0
    Mechanics:
      - "CustomSound{sound=donating.gun.smg.shoot, volume=6, noise=0.05}"
  Reload:
    Trigger:
      Main_Hand: "DROP_ITEM"
      Off_Hand: "DROP_ITEM"
    Magazine_Size: 32
    # Donating: item ammo bought at gun shops (shop.sk); without this the gun reloads for free.
    Ammo:
      Ammos:
        - "Donating_Light"
    Reload_Duration: 31
    # Donating (2026-10-05): the new magazine clicks home 27 ticks after the old one comes out, where the pack seats
    # it (tools\guns\uzi.js). Not in Finish_Mechanics: WeaponMechanics plays those at the very end of the chain, after
    # an empty reload's Close (the charging handle's release, below), so the click came last.
    Start_Mechanics:
      - "CustomSound{sound=donating.gun.smg.mag_out, volume=0.5, noise=0.05}"
      - "CustomSound{sound=donating.gun.smg.mag_in, volume=0.5, noise=0.05, delayBeforePlay=27}"
  Damage:
    # Donating (owner, 2026-09-26): nerfed so the strongest gun kills an unarmored player in 4 body
    # shots and one in the best gear (11 armor points, Per_Armor_Point -6% in config.yml) in 10-12.
    Base_Damage: 4.85
    Armor_Damage: 3
    Dropoff:
      - "10 -1.09"
      - "25 -2.18"
      - "50 -3.27"
  Scope:
    Trigger:
      Main_Hand: "LEFT_CLICK"
      Off_Hand: "LEFT_CLICK"
    Zoom_Amount: 1.3
    Shoot_Delay_After_Scope: 9
    Mechanics:
      - "CustomSound{sound=scope.in, volume=0.5, noise=0.1, listeners=Source{}}"
    Zoom_Off:
      Mechanics:
        - "CustomSound{sound=scope.out, volume=0.5, noise=0.1, listeners=Source{}}"
  Firearm_Action:
    Type: "SLIDE"
    # Donating (2026-10-05): an empty reload pulls the charging handle back first (Open) and lets it go last (Close);
    # tools\guns\uzi.js draws both. The bolt sound is two clicks (back and locked; slapped and home).
    Open:
      Time: 5
      Mechanics:
        - "CustomSound{sound=donating.gun.smg.bolt, volume=0.5, noise=0.05, listeners=Source{}}"
    Close:
      Time: 5
      Mechanics:
        - "CustomSound{sound=donating.gun.smg.bolt, volume=0.5, pitch=1.1, noise=0.05, listeners=Source{}}"

  # The following options are added by WeaponMechanicsCosmetics, and you will
  # not see the changes take effect until you purchase it.

  Cosmetics:
    Muzzle_Flash: true
    Splash_Mechanics:
      - "Sound{sound=entity.generic.splash, volume=0.65, pitch=1.85, noise=0.15} @Target{}"
      - "Particle{particle=WATER_SPLASH, count=20, noise=0.2 0.2 0.2} @Target{}"
    Bullet_Zip:
      Maximum_Distance: 4.0
      Sounds:
        - "CustomSound{sound=fx.whiz, noise=0.02, listeners=Target{}} @Target{}"
    Third_Person_Pose:
      Default: NONE
      Scope: BOW
      Reload: BLOCK
      Firearm_Action: CROSSBOW

  Trail:
    Distance_Between_Particles: 0.3
    Particle_Chooser: LOOP
    Particles:
      - "Particle{particle=DUST_COLOR_TRANSITION, color=RED, fadeColor=YELLOW, size=0.4}"

  Show_Time:
    Reload:
      Item_Cooldown: true
      Exp: true
      Action_Bar: "<gray>Reloading <bar> <gray><time>s"
      Action_Bar_Cancelled: "<red>Reload Cancelled"
      Bar:
        Left_Color: "<gray>"
        Right_Color: "<red>"
        Left_Symbol: "|"
        Right_Symbol: "|"
        Symbol_Amount: 32
    Weapon_Equip_Delay:
      Item_Cooldown: true
    Shoot_Delay_After_Scope:
      Item_Cooldown: true