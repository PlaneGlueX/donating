M4A1:
  Info:
    Weapon_Item:
      Type: "FEATHER"
      Name: "<gold>Combat Rifle"
      # Donating (2026-10-06): the numbers sit under the AK-48's (66.5), which costs more: more accurate, further-reaching
      # and lighter, less damage and a slower rate (bursts). The total is their mean.
      Lore:
        - "<gray>A scoped battle rifle with a bayonet."
        - "<gray>Three-round bursts; it holds up at range."
        - ""
        - "<gray>Weapon Statistics <gold>-<gray> 65.3"
        - "<gold>➣<gray> 72 <gold>⟸ <gray>Accuracy"
        - "<gold>➣<gray> 68 <gold>⟸ <gray>Damage"
        - "<gold>➣<gray> 70 <gold>⟸ <gray>Range"
        - "<gold>➣<gray> 50 <gold>⟸ <gray>Fire Rate"
        - "<gold>➣<gray> 64 <gold>⟸ <gray>Mobility"
        - "<gold>➣<gray> 68 <gold>⟸ <gray>Control"
      Unbreakable: true
      Hide_Flags: true
      Attributes:
        - "movement_speed -0.0012"
      Deny_Use_In_Crafting: true
    Weapon_Info_Display:
      Action_Bar:
        Message: "<gold>Combat Rifle<firearm_state> <gray>«<gold><ammo_left><gray>»<gold><reload>"
    # Donating (owner, 2026-09-29): gun noises 35% quieter. The vanilla sounds in this file play at 65% of before (volume 1 -> 0.65,
    # 0.5 -> 0.325); WeaponMechanics' own (shots, reloads, scope, whiz) are lowered in the pack (tools\build-pack.js GUN_SOUND_VOLUME).
    Weapon_Get_Mechanics:
      - "Sound{sound=item.armor.equip_chain, volume=0.65, pitch=0.75, listeners=Source{}}"
    # Donating (2026-10-06): the draw's sounds (the pack animates the 26-tick draw: the gun rises and the T-handle is
    # racked, pulled at tick ~16; Weapon_Get_Mechanics only plays when the gun is given).
    Weapon_Equip_Mechanics:
      - "CustomSound{sound=donating.gun.m16.draw, volume=0.5, noise=0.05, listeners=Source{}}"
      - "CustomSound{sound=donating.gun.m16.charge, volume=0.5, noise=0.05, listeners=Source{}, delayBeforePlay=16}"
    Weapon_Equip_Delay: 26
    Cancel:
      Drop_Item: true
      Swap_Hands: true
      Arm_Swing_Animation: true
      Break_Blocks: true
  # Donating (2026-10-06, the Combat Rifle: a Pixel Gun 3D-style M16 with an ACOG and a bayonet): the pack draws
  # Default 7, Scope (+1000), Sprint (+2000) and Reload (+3000) (no No_Ammo: WeaponMechanics puts it over Scope and
  # Sprint, so an empty gun would drop out of the sights), and animates the draw, each round of a burst and the reload
  # from the cooldown DonatingPhone's GunFx starts (tools\guns\m16.js; gunfx M4A1: shot 4, draw 26).
  Skin:
    Default: 7
    Scope: ADD 1000
    Sprint: ADD 2000
    Reload: ADD 3000
  Projectile: "donating_rifle_bullet"
  Shoot:
    Trigger:
      Main_Hand: "RIGHT_CLICK"
      Off_Hand: "RIGHT_CLICK"
      Circumstance:
        Swimming: "DENY"
        Sprinting: "DENY"
    Projectile_Speed: 90
    # Donating (2026-10-06): a 3-round burst (our own idea: PG3D's Combat Rifle is full auto). The rounds go 2 ticks
    # apart; a held click starts a new burst every 8 ticks (7.5 rounds a second). The worst burst on a bare target,
    # 3 x 4.9 x 1.35 = 19.85, never kills from full health.
    Delay_Between_Shots: 2
    Burst:
      Shots_Per_Burst: 3
      Ticks_Between_Each_Shot: 2
    Spread:
      Base_Spread: 2.6
      Modify_Spread_When:
        Zooming: 40%
        Sneaking: 60%
        In_Midair: 160%
    Recoil:
      Mean_X: 0.1
      Mean_Y: 0.9
      Variance_X: 0.15
      Variance_Y: 0.15
      Speed: 2.6
      Damping: 0.12
      Damping_Recovery: 0.2
      Smoothing: 0.35
      Max_Accumulation: 8.0
    Mechanics:
      - "CustomSound{sound=donating.gun.m16.shoot, volume=6, noise=0.05}"
  Reload:
    Trigger:
      Main_Hand: "DROP_ITEM"
      Off_Hand: "DROP_ITEM"
    Magazine_Size: 30
    # Donating: item ammo bought at gun shops (shop.sk); without this the gun reloads for free.
    Ammo:
      Ammos:
        - "Donating_Rifle"
    Reload_Duration: 50
    # Donating (2026-10-06): each sound where the pack's frames show it (tools\guns\m16.js reload: the magazine drops at
    # p 0.16, the new one seats at 0.52, the T-handle is pulled at 0.68 (the sound's second click is its release), the
    # forward assist is tapped at 0.84). Not in Finish_Mechanics: WeaponMechanics plays those at the very end of the
    # chain. With rounds left the frames run over 50 ticks; from empty the Firearm_Action's open (6 ticks) comes first,
    # the frames stretch to 62 and these sounds start 6 ticks later. The delays split the difference (56p - 3): every
    # sound within about 3 ticks of its frame either way.
    Start_Mechanics:
      - "CustomSound{sound=donating.gun.m16.mag_out, volume=0.5, noise=0.05, delayBeforePlay=6}"
      - "CustomSound{sound=donating.gun.m16.mag_in, volume=0.5, noise=0.05, delayBeforePlay=26}"
      - "CustomSound{sound=donating.gun.m16.charge, volume=0.5, noise=0.05, delayBeforePlay=35}"
      - "CustomSound{sound=donating.gun.m16.assist, volume=0.5, noise=0.05, delayBeforePlay=44}"
  Damage:
    # Donating (2026-10-06): under the AK-48 up close, the flattest dropoff of the automatic guns: 4.90 / 4.60 / 4.20 /
    # 3.70 (5 body hits bare, 13 in the best gear).
    Base_Damage: 4.9
    Armor_Damage: 3
    Dropoff:
      - "10 -0.3"
      - "25 -0.7"
      - "50 -1.2"
  Scope:
    Trigger:
      Main_Hand: "LEFT_CLICK"
      Off_Hand: "LEFT_CLICK"
    Zoom_Amount: 2.0
    Shoot_Delay_After_Scope: 12
    Mechanics:
      - "CustomSound{sound=scope.in, volume=0.5, noise=0.1, listeners=Source{}}"
    Zoom_Off:
      Mechanics:
        - "CustomSound{sound=scope.out, volume=0.5, noise=0.1, listeners=Source{}}"
  # Donating (2026-10-06): silent; the T-handle is drawn and heard in every reload (Start_Mechanics above), and this only
  # runs on an empty reload, where its sounds would play with nothing on screen.
  Firearm_Action:
    Type: "SLIDE"
    Open:
      Time: 6
    Close:
      Time: 6

  Show_Time:
    Reload:
      Item_Cooldown: true
      Exp: true
      Action_Bar: "<gray>Reloading <bar> <gray><time>s"
      Action_Bar_Cancelled: "<red>Reload Cancelled"
      Bar:
        Left_Color: "<gray>"
        Right_Color: "<red>"
        Left_Symbol: "|"
        Right_Symbol: "|"
        Symbol_Amount: 30
    Weapon_Equip_Delay:
      Item_Cooldown: true
    Shoot_Delay_After_Scope:
      Item_Cooldown: true
