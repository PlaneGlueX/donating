Throwing_Knife:
  Info:
    Weapon_Item:
      # Donating: not a feather (WeaponMechanics' pack owns feather.json); the pack's amethyst_shard.json
      # draws it by its custom model data (tools\make-item-art.js, Melee weapons and consumables).
      Type: "AMETHYST_SHARD"
      Name: "<gold>Throwing Knife"
      Lore:
        - "<gray>Right-click to throw. It flies in an arc:"
        - "<gray>aim a little high at range. Each throw uses one."
        - ""
        - "<gray>Weapon Statistics"
        - "<gold>➣<gray> 5 <gold>⟸ <gray>Damage"
      Unbreakable: true
      Hide_Flags: true
      Deny_Use_In_Crafting: true
    Weapon_Get_Mechanics:
      - "Sound{sound=item.armor.equip_chain, pitch=1.2, listeners=Source{}}"
    Cancel:
      Block_Interactions: true
      Item_Interactions: true
      Drop_Item: true
      Swap_Hands: true
  Skin:
    Default:
      Custom_Model_Data: 3
  Projectile: "donating_throwing_knife"
  Shoot:
    Trigger:
      Main_Hand: "RIGHT_CLICK"
      Off_Hand: "RIGHT_CLICK"
      Circumstance:
        Swimming: "DENY"
    # 1.8 blocks a tick (Projectile_Speed / 20), with gravity (donating_throwing_knife).
    Projectile_Speed: 36
    Consume_Item_On_Shoot: true
    Delay_Between_Shots: 12
    Mechanics:
      - "Sound{sound=item.trident.throw, pitch=1.4, volume=0.7, noise=0.1}"
  Damage:
    # Donating (owner, 2026-09-28): like the Combat Knife, 5 a hit (4 hits unarmored, 12 in the best
    # gear), but from range, one knife a throw, a throw every 12 ticks.
    Base_Damage: 5
    Armor_Damage: 2
    Mechanics:
      - "Sound{sound=item.trident.hit, pitch=1.3} @Target{}"
