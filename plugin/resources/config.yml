# The city the phones show: one locked map, or a grid of locked maps of the same scale that sit side by
# side (like a map wall). One line per row, north to south; each row lists its maps west to east.
#   One map:        city-maps: [[12]]
#   2 x 2 maps:     city-maps: [[12, 13], [14, 15]]
# Their named banners become labels. After changing this or adding banners: /dphone
# Empty until the city map exists (phones stay blank until then).
city-maps: []
# How many phone maps to keep, one per online player (their ids are in pool.yml, made automatically).
pool-size: 16
# Held phone: screen pixels per city-map pixel (2 = zoomed in 2x).
zoom: 2
# Held phone re-centers once you're this many screen pixels from the middle.
follow-step: 4
# Big map (right-click): the whole city is shrunk to fit the screen. The camera turns down to this
# pitch when it opens (a map held in both hands only faces you at about 50 degrees down; 0 = never).
open-pitch: 70
# Big map cursor: screen pixels it moves per degree you turn your head.
cursor-speed: 3.0
# A passive player's name shows while the cursor is this close to their arrow (screen pixels).
hover-radius: 6
# Smaller arrows on the big map (the resource pack draws them; without the pack they'd show as
# jungle temple / swamp hut icons, so set false if the pack isn't used).
small-arrows: true
# Scoreboard tags that Skript sets (nav.sk, phone.sk).
passive-tag: donating_passive
open-tag: donating_phone_open
# Bottom line on the held phone (ASCII only; "" = none).
hint: "R-click: map  F: apps"

# ---------- GPS (gps.sk sets each player's target; this finds the way along the roads and draws it) ----------
gps:
  # The road grid: /dphone roads scan reads the city (only land that already exists) for these blocks and
  # saves roads.bin next to this file. Build streets from blocks used nowhere else (never indoors or on
  # roofs), and list the lane lines and crosswalks too. Rescan after changing the streets or this list.
  road-blocks: [black_concrete, gray_concrete, black_concrete_powder, gray_concrete_powder, white_concrete, yellow_concrete]
  # The heights people walk and drive at: street-y-min a few blocks below the street, street-y-max the street
  # level + 2 (so anything taller than a curb, a wall or a building, is solid in the band and reads as
  # blocked). Leave these out to use the whole world height; then roofs count as open ground, so set them
  # once the city exists. Wall, fence and pane tops never count as ground.
  # street-y-min: 58
  # street-y-max: 66
  # Step costs by kind of ground (1 = a road step). Walkers may cut through an alley; cars keep to roads.
  foot-cost: {road: 1.0, open: 1.5, blocked: 15}
  car-cost: {road: 1.0, open: 6, blocked: 40}
  # The grid stays under this many cells (a bigger city gets bigger cells).
  max-cells: 262144
  # The locator-bar dot sits at the next corner, lead-min..lead-max blocks ahead (farther when faster).
  lead-min: 16
  lead-max: 40
  # The dust trail on the way ahead: trail-min..trail-max blocks (farther when faster).
  trail-min: 24
  trail-max: 64
  # The ring around the target's area shows within this many blocks of it.
  ring-range: 48
  # Colors: the locator-bar dot, the trail and ring (color), and the route on the phone map (route). Keep
  # them apart from the POI and heist dots (aqua, yellow, white, light purple, green, gold, dark red).
  # A pin is a bigger area for someone in a car (they cover 6 blocks between two checks).
  car-pin-radius: 14
  color: {pin: "#D040E0", quest: "#FF5A1F", loot: "#30C8C0"}
  route: {pin: "#D040E0", quest: "#FF5A1F", loot: "#30C8C0"}
  # Skript sets this tag while the GPS should show nothing in the world (inside a heist).
  paused-tag: donating_gps_paused

# Nametags only in the open (Nametags.java, needs TAB): a player's name is hidden from a viewer while full opaque
# blocks stand between them (glass, leaves, bars and slabs don't count), checked every `every` ticks for players
# within `range` blocks; hidden after `hide-after` checks in a row with no clear ray, shown again at once.
nametags:
  enabled: true
  range: 64
  every: 5
  hide-after: 2

# Smoother cars (CarSmooth.java): a driven MTVehicles car's model and seats are sent to players every tick instead of
# every 3rd (armor stands' vanilla update interval), and as far as its driver is (no driver floating in mid-air with no car
# between 64 and 128 blocks). /dphone carsmooth <mode> switches it live for A/B drives and keeps the choice in
# carsmooth.yml (which then wins over this line; delete carsmooth.yml to go back to it). /dphone carprobe <plate> <ticks>
# logs a drive to carprobe.log.
carsmooth:
  # off | sync | track | all (the live switch /dphone carsmooth wins, kept in carsmooth.yml). Measured 2026-09-29: track is
  # what helps (car stands every tick); sync never had anything to fix.
  mode: track
  # Blocks within which a driven car's stands are sent (armor stands: spigot.yml 64; the seat with its driver: 128).
  range: 128
  # Ticks between the car stands' position packets while tracked (vanilla armor stands: 3).
  update-interval: 1

# The chase camera (CarCam.java): drivers look through an invisible camera behind and above their car instead of first
# person, from getting in to getting out (carcam.sk: /carcam on|off per player, health on the action bar while it's on,
# since the client hides the hotbar and hearts under another camera). Tune live: /dphone cam tune <key> <value>.
carcam:
  enabled: true
  # Blocks behind the car, the camera's height over the car, and the height it looks at (pitch = atan((height -
  # look-height) / distance)). A wall between the car and the camera pulls it in (never inside a block).
  distance: 5.5
  height: 2.3
  look-height: 1.2
  # How fast the camera swings behind the car in a turn (share of the angle left, per tick; 1 = locked to the car).
  yaw-smooth: 0.35
  # Degrees added to the car's heading (180 would put the camera in front, looking back).
  yaw-offset: 0
  # Client-side smoothing of each camera move, in ticks (0 = snap; 1-5 worth trying in a playtest).
  teleport-duration: 3
  # true: only while the car key (hotbar 9) is held. false: the whole ride (select-key below picks the key anyway).
  only-with-key: false
  # The client still draws the held item at the camera (a gun covered a third of the view). true: when the view starts,
  # hotbar 9 is selected (the car key, a map with the phone's GPS view, drawn small in the corner like a minimap), and
  # getting out puts back the slot held before, unless the player picked another slot during the ride (theirs then).
  select-key: true
  # The client never draws the driver's own player under another camera, so the car looked empty. true: a mannequin with
  # the driver's skin rides the driver's seat, sent to the driver only (the client sits it and turns it with the car);
  # invulnerable and not collidable, so no bullet or arrow ever hits it instead of the driver. false: an empty car.
  body: true
  # Everyone, chase view or not: the driver's seat gets this camera_distance, so pressing F5 in a car sits farther back
  # (the client uses the larger of the player's and the seat's; vanilla 4). 0 = leave it.
  seat-camera-distance: 7
